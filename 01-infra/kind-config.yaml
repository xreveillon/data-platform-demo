kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: data-platform
networking:
  ipFamily: ipv4
nodes:
  - role: control-plane
    image: kindest/node:v1.33.1
  - role: worker
    image: kindest/node:v1.33.1
    labels:
      net: metallb-gateway
    # extraPortMappings:
    #   # port forward 80 on the host to 80 on this node
    #   - containerPort: 80
    #     hostPort: 80
    #     listenAddress: "0.0.0.0"
    #     # optional: set the protocol to one of TCP, UDP, SCTP.
    #     # TCP is the default
    #     protocol: TCP
    #   # port forward 80 on the host to 80 on this node
    #   - containerPort: 443
    #     hostPort: 443
    #     listenAddress: "0.0.0.0"
    #     # optional: set the protocol to one of TCP, UDP, SCTP.
    #     # TCP is the default
    #     protocol: TCP
  - role: worker
    image: kindest/node:v1.33.1
