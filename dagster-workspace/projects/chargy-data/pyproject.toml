[project]
name = "chargy"
requires-python = ">=3.13,<3.14"
version = "0.1.0"
dependencies = [
    "dagster>=1.11.16",
    "dagster-aws>=0.27.16",
    "dagster-iceberg[polars]>=0.3.8",
    "dagster-postgres>=0.28.0",
    "logging>=0.4.9.6",
    "pathlib>=1.0.1",
    "polars[connectorx]>=1.35.2",
    "pydantic-extra-types>=2.10.6",
    "s3fs>=2025.10.0",
]

[dependency-groups]
dev = [
    "dagster-webserver",
    "dagster-dg-cli",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "chargy"
registry_modules = [
    "chargy.components.*",
]
